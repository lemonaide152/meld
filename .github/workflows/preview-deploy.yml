# Deploy the pull request branch to an isolated Worker and D1 database.
# The script name is meld-prev-<guid>. Production Worker meld is not a target.

name: Preview deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: meld-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve preview GUID
        id: guid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python3 deploy/preview_ops.py resolve-guid

      - name: Record preview identity before deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PREVIEW_GUID: ${{ steps.guid.outputs.guid }}
        run: python3 deploy/preview_ops.py comment

      - name: Deploy isolated preview Worker and D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PREVIEW_GUID: ${{ steps.guid.outputs.guid }}
        run: python3 deploy/preview_ops.py deploy
