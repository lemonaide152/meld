<!doctype html>
<!-- Not the shipped card. deploy/static/og.png is the 1200×630 asset served at /og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #ece3cf;
    color: #2e4a7d;
  }
  .frame {
    box-sizing: border-box;
    width: 1200px;
    height: 630px;
    padding: 36px;
  }
  .inner {
    box-sizing: border-box;
    height: 100%;
    border: 2px solid #2e4a7d;
    padding: 52px 60px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .mark {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #2e4a7d;
  }
  h1 {
    margin: 0;
    font-family: "Noto Serif", Georgia, serif;
    font-weight: 500;
    font-size: 68px;
    line-height: 1.12;
    letter-spacing: -0.02em;
    color: #2e4a7d;
    max-width: 980px;
  }
  .sub {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 22px;
    line-height: 1.45;
    color: #5c5a53;
    max-width: 920px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="inner">
      <div class="mark">meld</div>
      <h1>A temporary resource to align context.</h1>
      <div class="sub">Pick 3 minutes, 1 hour, or 1 day.<br>When the clock ends, the link dies.<br>Not for secrets.</div>
    </div>
  </div>
</body>
</html>
